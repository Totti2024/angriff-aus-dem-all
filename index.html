// Sprites einmal als Bild vorrendern (schneller, und Treffer-Blitz in Weiss)
const spriteCache = new Map();
function spriteImg(rows, px, tint) {
  const key = rows.join('|') + px + (tint || '');
  let img = spriteCache.get(key);
  if (img) return img;
  img = document.createElement('canvas');
  img.width = rows[0].length * px; img.height = rows.length * px;
  const g = img.getContext('2d');
  rows.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '.') continue;
      g.fillStyle = tint || PAL[c];
      g.fillRect(i * px, j * px, px, px);
    }
  });
  spriteCache.set(key, img);
  return img;
}
function drawSprite(rows, x, y, px, tint) {
  ctx.drawImage(spriteImg(rows, px, tint), Math.round(x), Math.round(y));
}

/* ---------- Ton (alles im Code erzeugt) ---------- */
let ac = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = soundOn ? 0.8 : 0; master.connect(ac.destination);
  sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  musicBus = ac.createGain(); musicBus.gain.value = 0.45; musicBus.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // stille Note, damit iOS den Ton freischaltet
  const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0;
  o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + 0.05);
  musicNext = ac.currentTime + 0.1;
}
function setSound(on) {
  soundOn = on; store.set('aada-sound', on);
  if (master) master.gain.setTargetAtTime(on ? 0.8 : 0, ac.currentTime, 0.02);
}
function tone(f, dur, type = 'square', vol = 0.15, f2 = null, when = 0, bus = sfxBus) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 2000, when = 0) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime + when;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxBus);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const sfx = {

// Musik: marschierender Bass wie im Original, dazu eine leise Melodie.
let musicNext = 0, musicStep = 0;
const BASS = [110, 98, 87.31, 82.41];
const BASS_BOSS = [110, 116.54, 110, 103.83];
const MELODY = [440, 0, 523.25, 0, 659.25, 587.33, 523.25, 0, 440, 0, 392, 0, 440, 0, 0, 0];
const MELODY_TITLE = [329.63, 0, 392, 0, 440, 0, 392, 0, 329.63, 0, 293.66, 0, 329.63, 0, 0, 0];
function musicTempo() {
  if (state === 'title' || state === 'entername' || state === 'gameover') return 0.32;
  if (boss) return 0.16;
  const frac = waveTotal ? enemies.filter(e => e.type !== 'mini').length / waveTotal : 1;
  return Math.max(0.12, 0.34 - (1 - frac) * 0.2 - Math.min(wave, 20) * 0.003);
}
function updateMusic() {
  if (!ac || !soundOn || state === 'paused') return;
  if (musicNext < ac.currentTime) musicNext = ac.currentTime + 0.05;
  while (musicNext < ac.currentTime + 0.15) {
    const when = musicNext - ac.currentTime;
    const title = state === 'title' || state === 'entername' || state === 'gameover';
    const bass = boss ? BASS_BOSS : BASS;
    tone(bass[musicStep % 4], 0.14, 'triangle', title ? 0.12 : 0.22, null, when, musicBus);
    const mel = title ? MELODY_TITLE : MELODY;
    const m = mel[(musicStep * 2) % 16];
    if (m && !title) tone(m * (boss ? 1.06 : 1), 0.08, 'square', 0.03, null, when + 0.02, musicBus);
    if (m && title) tone(m, 0.25, 'triangle', 0.05, null, when, musicBus);
    musicStep++;
    musicNext += musicTempo();
  }
}

    stars = Array.from({ length: 140 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      s: Math.random() < 0.15 ? 2 : 1, v: Math.random() * 0.5 + 0.1, a: Math.random() * 0.5 + 0.1

/* ---------- Barrikaden: Pixelmasken, die zerbroeseln ---------- */
const BC = 3, BW = 22, BH = 14;
function makeBarricades() {
  barricades = [0, 1, 2].map(b => {
    const m = [];
    for (let y = 0; y < BH; y++) {
      m.push([]);
      for (let x = 0; x < BW; x++) {
        let on = true;
        if (y < 3 && (x < 3 - y || x > BW - 4 + y)) on = false;
        if (y > 9 && x > 6 && x < 15) on = false;
        m[y].push(on);
      }
    }
    return { x: 40 + b * 120, y: barY, m };
  });
}
function nibble(bar, cx, cy, r) {
  for (let y = Math.max(0, Math.floor(cy - r - 2)); y < Math.min(BH, cy + r + 2); y++)
    for (let x = Math.max(0, Math.floor(cx - r - 2)); x < Math.min(BW, cx + r + 2); x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d < r || (d < r + 1.5 && Math.random() < 0.5)) bar.m[y][x] = false;
    }
}
// Trifft Punkt (x,y) eine Barrikade? Dann anknabbern und true.
function hitBarricade(x, y, r = 1.8) {
  for (const bar of barricades) {
    if (x < bar.x || x >= bar.x + BW * BC || y < bar.y || y >= bar.y + BH * BC) continue;
    const cx = Math.floor((x - bar.x) / BC), cy = Math.floor((y - bar.y) / BC);
    if (bar.m[cy] && bar.m[cy][cx]) { nibble(bar, cx, cy, r); return true; }
  }
  return false;
}
// Eigene Schuesse prallen ab, ohne die Wand zu beschaedigen
function blockedByBarricade(x, y) {
  for (const bar of barricades) {
    if (x < bar.x || x >= bar.x + BW * BC || y < bar.y || y >= bar.y + BH * BC) continue;
    const cx = Math.floor((x - bar.x) / BC), cy = Math.floor((y - bar.y) / BC);
    if (bar.m[cy] && bar.m[cy][cx]) return true;
  }
  return false;
}
// Gegner, die durch Barrikaden fliegen, fressen sich durch
function eraseRect(x, y, w, h) {
  for (const bar of barricades) {
    if (x + w < bar.x || x > bar.x + BW * BC || y + h < bar.y || y > bar.y + BH * BC) continue;
    for (let cy = 0; cy < BH; cy++) for (let cx = 0; cx < BW; cx++) {
      const px = bar.x + cx * BC, py = bar.y + cy * BC;
      if (px + BC > x && px < x + w && py + BC > y && py < y + h) bar.m[cy][cx] = false;
    }
  }
}

/* ---------- Gegner ---------- */
const TYPES = {
  normal:   { hp: 1, pts: 10, px: 3 },
  tank:     { hp: 3, pts: 30, px: 3 },
  diver:    { hp: 1, pts: 20, px: 3 },
  splitter: { hp: 1, pts: 20, px: 3 },
  sniper:   { hp: 1, pts: 40, px: 3 },
  mini:     { hp: 1, pts: 15, px: 3 }
};
function sprFrames(type) { return SPR[type]; }
function makeEnemy(type, col, row) {
  const f = sprFrames(type)[0], px = TYPES[type].px;
  return {
    type, col, row, hp: TYPES[type].hp, maxhp: TYPES[type].hp,
    w: f[0].length * px, h: f.length * px, x: 0, y: 0,
    mode: 'form', t: 0, flash: 0,
    cd: 120 + Math.random() * 200 // Abklingzeit Scharfschuetze / Sturzflug
  };
}
function waveRows(n) {
  if (n === 1) return ['normal', 'normal', 'normal'];
  if (n === 2) return ['normal', 'normal', 'normal', 'normal'];
  if (n === 3) return ['tank', 'normal', 'normal', 'normal'];
  if (n === 4) return ['tank', 'diver', 'normal', 'normal'];
  if (n === 6) return ['tank', 'splitter', 'diver', 'normal', 'normal'];
  if (n === 7) return ['sniper', 'tank', 'splitter', 'diver', 'normal'];
  // ab Welle 8: Mischung, hinten immer Scharfschuetzen
  const pool = ['tank', 'diver', 'splitter', 'normal', 'normal', 'diver', 'splitter', 'tank'];
  const rows = ['sniper'];
  for (let i = 0; i < 4; i++) rows.push(pool[Math.floor(Math.random() * pool.length)]);
  rows.sort((a, b) => ['sniper', 'tank', 'splitter', 'diver', 'normal'].indexOf(a) - ['sniper', 'tank', 'splitter', 'diver', 'normal'].indexOf(b));
  return rows;
}
const COLS = 6, CSP = 52, RSP = 40;
function spawnWave() {
  enemies = []; bullets = []; eBullets = []; capsules = [];
  boss = null; ufo = null; ufoT = 1200 + Math.random() * 600;
  makeBarricades();
  if (wave % 5 === 0) { spawnBoss(); waveTotal = 1; return; }
  const rows = waveRows(wave);
  rows.forEach((type, r) => { for (let c = 0; c < COLS; c++) enemies.push(makeEnemy(type, c, r)); });
  waveTotal = enemies.length;
  form = {
    x: (W - ((COLS - 1) * CSP + 33)) / 2, y: playTop + 18 - 60, targetY: playTop + 18,
    dir: 1,
    speed: Math.min(1.6, 0.35 + 0.07 * (wave - 1)),
    step: wave <= 2 ? 10 : 14
  };
  placeFormation();
}
function placeFormation() {
  for (const e of enemies) if (e.mode === 'form') {
    e.x = form.x + e.col * CSP + (33 - e.w) / 2;
    e.y = form.y + e.row * RSP;
  }
}
function slotPos(e) { return { x: form.x + e.col * CSP + (33 - e.w) / 2, y: form.y + e.row * RSP }; }

function spawnBoss() {
  const k = (wave / 5 - 1) % 3, lvl = Math.floor((wave / 5 - 1) / 3);
  const rows = SPR.boss[k], px = 6;
  boss = {
    k, lvl, w: rows[0].length * px, h: rows.length * px, px,
    x: W / 2 - rows[0].length * px / 2, y: -80, ty: playTop + 22,
    hp: Math.round((70 + 30 * k) * (1 + 0.6 * lvl)), t: 0, flash: 0, phase: 0, laser: null, ang: 0
  };
  boss.max = boss.hp;
  banner = { text: 'ACHTUNG BOSS', sub: BOSS_NAMES[k] + (lvl ? ' MK ' + (lvl + 1) : ''), t: 150, color: PAL.R };
  sfx.siren();
}

/* ---------- Spielstart ---------- */
function newGame() {
  score = 0; lives = 3; wave = 1; nextLifeAt = 10000;
  power.triple = power.rapid = power.shield = 0;
  player = { x: W / 2 - 22, y: playerY, w: 44, h: 32, inv: 0, dead: false };
  particles = []; popups = [];
  shake = 0; deathT = 0; waveEndT = 0;
  spawnWave();
  banner = { text: 'WELLE 1', sub: 'FINGER ZIEHEN ZUM STEUERN', t: 140, color: GREEN };
  setState('play');
  requestWake();
}
function setState(s) { state = s; stateT = 0; }

function pts(base) { return Math.round(base * (1 + 0.15 * (wave - 1)) / 5) * 5; }
function addScore(n, x, y) {
  score += n;
  if (x !== undefined) popups.push({ x, y, text: String(n), t: 40 });
  while (score >= nextLifeAt) {
    nextLifeAt += 10000;
    if (lives < 5) { lives++; sfx.life(); popups.push({ x: W / 2, y: playerY - 40, text: 'EXTRALEBEN', t: 80, color: PAL.R }); }
  }
}

/* ---------- Partikel ---------- */
function explode(x, y, n, colors, speed = 3, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * speed + 0.5;
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 30 + Math.random() * 25, max: 55,
      c: colors[i % colors.length], s: size * (0.5 + Math.random() * 0.7)
    });
  }
}

/* ---------- Power-ups ---------- */
const CAPS = {
  triple: { l: '3', c: PAL.C, name: 'DREIFACHSCHUSS' },
  shield: { l: 'S', c: GREEN, name: 'SCHILD' },
  rapid:  { l: 'F', c: PAL.Y, name: 'SCHNELLFEUER' },
  life:   { l: '+', c: PAL.R, name: 'EXTRALEBEN' }
};
function maybeDrop(x, y, chance) {
  if (capsules.length || Math.random() > chance) return;
  dropCapsule(x, y);
}
function dropCapsule(x, y) {
  const bag = ['triple', 'triple', 'triple', 'rapid', 'rapid', 'rapid', 'shield', 'shield'];
  if (lives < 5) bag.push('life');
  capsules.push({ x: x - 12, y, k: bag[Math.floor(Math.random() * bag.length)], t: 0 });
}
function collect(k) {
  sfx.power();
  if (k === 'life') {
    if (lives < 5) lives++;
  } else power[k] = POWER_TIME;
  popups.push({ x: player.x + 22, y: player.y - 20, text: CAPS[k].name, t: 70, color: CAPS[k].c });
}

/* ---------- Treffer am Spieler ---------- */
function hurtPlayer() {
  if (player.inv > 0 || player.dead) return;
  if (power.shield > 0) {
    power.shield = 0; player.inv = 60; sfx.shield();
    explode(player.x + 22, player.y + 16, 16, [GREEN, '#bfffd0'], 3, 3);
    return;
  }
  lives--;
  sfx.playerHit();
  shake = 18;
  explode(player.x + 22, player.y + 16, 40, [PAL.C, PAL.O, PAL.Y, '#fff'], 4, 5);
  eBullets = [];
  power.triple = power.rapid = 0;
  if (lives <= 0) { player.dead = true; deathT = 90; return; }
  player.inv = 120;
}

/* ---------- Update (fester Takt, 60 pro Sekunde) ---------- */
const keys = {};
function update() {
  stateT++;
  for (const s of stars) { s.y += s.v * (state === 'play' ? 1.6 : 1); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  if (state !== 'play') return;

  if (banner) { banner.t--; if (banner.t <= 0) banner = null; }
  if (shake > 0) shake *= 0.85, shake < 0.5 && (shake = 0);

  // Tod: kurze Explosion, dann Game Over
  if (player.dead) {
    updateParticles();
    if (--deathT <= 0) endGame();
    return;
  }

  // Tastatur
  if (keys.ArrowLeft || keys.a || keys.A) player.x -= 5;
  if (keys.ArrowRight || keys.d || keys.D) player.x += 5;
  player.x = Math.max(4, Math.min(W - player.w - 4, player.x));
  if (player.inv > 0) player.inv--;
  for (const k of ['triple', 'rapid', 'shield']) if (power[k] > 0) power[k]--;

  // Auto-Feuer
  if (--fireT <= 0 && !waveEndT) {
    fireT = power.rapid > 0 ? 8 : 16;
    const cx = player.x + 21, cy = player.y - 8;
    bullets.push({ x: cx, y: cy, vx: 0 });
    if (power.triple > 0) { bullets.push({ x: cx, y: cy, vx: -1.8 }); bullets.push({ x: cx, y: cy, vx: 1.8 }); }
    sfx.shoot();
  }
  for (const b of bullets) { b.x += b.vx; b.y -= 10; }
  bullets = bullets.filter(b => {
    if (b.y < -12 || b.x < -10 || b.x > W + 10) return false;
    if (blockedByBarricade(b.x + 1.5, b.y) || blockedByBarricade(b.x + 1.5, b.y + 5)) {
      explode(b.x + 1.5, b.y + 4, 3, [PAL.P, '#d9a6ff'], 1.5, 2);
      return false;
    }
    return true;
  });

  updateUfo();

  updateEnemies();
  if (boss) updateBoss();

  // Gegnerschuesse
  for (const b of eBullets) { b.x += b.vx; b.y += b.vy; }
  eBullets = eBullets.filter(b => {
    if (b.y > H + 10 || b.y < -20 || b.x < -20 || b.x > W + 20) return false;
    if (hitBarricade(b.x + 1.5, b.y + b.h, 1.8)) return false;
    if (rectHit(b.x, b.y, 3, b.h, player.x + 4, player.y + 4, player.w - 8, player.h - 6)) { hurtPlayer(); return false; }
    return true;
  });

  // Spielerschuesse gegen Gegner (gehen durch eigene Barrikaden durch)
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let used = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!rectHit(b.x, b.y, 3, 10, e.x, e.y, e.w, e.h)) continue;
      used = true;
      e.hp--; e.flash = 5;
      if (e.hp <= 0) killEnemy(j); else sfx.hit();
      break;
    }
    if (!used && ufo && rectHit(b.x, b.y, 3, 10, ufo.x, ufo.y, ufo.w, ufo.h)) {
      used = true; killUfo();
    }
    if (!used && boss && boss.y > -40 && rectHit(b.x, b.y, 3, 10, boss.x + 6, boss.y, boss.w - 12, boss.h)) {
      used = true; boss.hp--; boss.flash = 4;
      explode(b.x, b.y, 3, [PAL.Y, '#fff'], 2, 3);
      if (boss.hp % 4 === 0) sfx.hit();
      if (boss.hp <= 0) killBoss();
    }
    if (used) bullets.splice(i, 1);
  }

  // Kapseln
  for (const c of capsules) { c.y += 1.6; c.t++; }
  capsules = capsules.filter(c => {
    if (rectHit(c.x, c.y, 24, 22, player.x, player.y - 6, player.w, player.h + 10)) { collect(c.k); return false; }
    return c.y < H + 30;
  });

  updateParticles();

  // Welle geschafft?
  if (!waveEndT && !enemies.length && !boss) {
    waveEndT = 150; ufo = null;
    const bonus = pts(100) * (wave % 5 === 0 ? 5 : 1);
    addScore(bonus);
    banner = { text: 'WELLE ' + wave + ' GESCHAFFT', sub: 'BONUS ' + bonus, t: 150, color: GREEN };
    sfx.waveClear();
  }
  if (waveEndT && --waveEndT === 0) {
    wave++;
    spawnWave();
    if (!boss) banner = { text: 'WELLE ' + wave, sub: waveHint(wave), t: 120, color: GREEN };
  }
}
/* ---------- Bonus-UFO wie 1978: nur Punkte ---------- */
const UFO_PTS = [50, 100, 100, 150, 150, 300];
function updateUfo() {
  if (ufo) {
    ufo.x += ufo.v; ufo.t++;
    if (ufo.t % 10 === 0) tone(ufo.t % 20 ? 640 : 820, 0.09, 'square', 0.03);
    if (ufo.x < -60 || ufo.x > W + 60) ufo = null;
    return;
  }
  if (boss || waveEndT || !form || form.y < form.targetY || !enemies.length) return;
  if (--ufoT <= 0) {
    ufoT = 1200 + Math.random() * 600; // alle 20 bis 30 Sekunden
    const dir = Math.random() < 0.5 ? 1 : -1, w = 13 * 3;
    ufo = { x: dir > 0 ? -w : W, y: playTop - 6, w, h: 18, v: dir * 1.6, t: 0 };
  }
}
function killUfo() {
  const n = UFO_PTS[Math.floor(Math.random() * UFO_PTS.length)];
  const cx = ufo.x + ufo.w / 2, cy = ufo.y + ufo.h / 2;
  addScore(n, cx, cy);
  const pop = popups[popups.length - 1]; pop.color = PAL.R; pop.t = 70;
  explode(cx, cy, 22, [PAL.R, PAL.Y, '#fff'], 3, 4);
  sfx.kill(); tone(1200, 0.25, 'square', 0.08, 300);
  ufo = null;
}
function waveHint(n) {
  return { 3: 'NEU: PANZER, 3 TREFFER', 4: 'NEU: STURZFLIEGER', 6: 'NEU: TEILER', 7: 'NEU: SCHARFSCHUETZEN' }[n] || '';
}
function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 0.6; p.t--; }
  popups = popups.filter(p => p.t > 0);
}
function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function killEnemy(j) {
  const e = enemies[j];
  enemies.splice(j, 1);
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  const base = TYPES[e.type].pts * (e.type === 'diver' && e.mode === 'dive' ? 2 : 1);
  addScore(pts(base), cx, cy);
  explode(cx, cy, 18, [PAL.O, PAL.Y, e.type === 'splitter' || e.type === 'mini' ? PAL.M : PAL.B], 3, 4);
  sfx.kill();
  shake = Math.max(shake, 3);
  if (e.type === 'splitter') {
    for (const s of [-1, 1]) {
      const m = makeEnemy('mini', 0, 0);
      m.mode = 'free'; m.x = cx - m.w / 2 + s * 10; m.y = cy;
      m.vx = s * (1.2 + Math.random() * 0.8); m.vy = 0.5 + wave * 0.02;
      enemies.push(m);
    }
  }
  maybeDrop(cx, cy, e.type === 'tank' ? 0.2 : 0.07);
}

function updateEnemies() {
  const inForm = enemies.filter(e => e.mode === 'form' || e.mode === 'dive' || e.mode === 'return');
  if (form && inForm.length) {
    // Einschweben am Wellenanfang
    if (form.y < form.targetY) { form.y = Math.min(form.targetY, form.y + 1.5); }
    else {
      const alive = enemies.filter(e => e.type !== 'mini').length;
      const sp = form.speed * (1 + 1.5 * (1 - alive / waveTotal));
      form.x += form.dir * sp;
      let minX = Infinity, maxX = -Infinity;
      for (const e of inForm) { const s = slotPos(e); minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x + e.w); }
      if ((form.dir > 0 && maxX > W - 10) || (form.dir < 0 && minX < 10)) {
        form.dir *= -1; form.y += form.step;
      }
    }
    placeFormation();
  }

  // Formation schiesst: unterster Gegner einer zufaelligen Spalte
  const rate = Math.min(0.04, 0.008 + 0.003 * (wave - 1));
  const bspeed = Math.min(5.5, 3.2 + 0.1 * wave);
  if (form && Math.random() < rate && form.y >= form.targetY) {
    const shooters = enemies.filter(e => e.mode === 'form' && e.type !== 'sniper');
    if (shooters.length) {
      const c = shooters[Math.floor(Math.random() * shooters.length)].col;
      const low = shooters.filter(e => e.col === c).sort((a, b) => b.y - a.y)[0];
      eBullets.push({ x: low.x + low.w / 2 - 1.5, y: low.y + low.h, vx: 0, vy: bspeed, h: 9, c: PAL.O });
    }
  }

  // Sturzflug: wie viele gleichzeitig, steigt mit der Welle
  const diving = enemies.filter(e => e.mode === 'dive').length;
  const maxDive = Math.min(3, 1 + Math.floor(wave / 6));

  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    e.t++; if (e.flash) e.flash--;

    if (e.type === 'sniper' && e.mode === 'form' && form.y >= form.targetY) {
      if (--e.cd <= 0) {
        e.cd = Math.max(110, 260 - wave * 6) + Math.random() * 120;
        const sx = e.x + e.w / 2, sy = e.y + e.h;
        const dx = player.x + 22 - sx, dy = player.y - sy, d = Math.hypot(dx, dy) || 1;
        const v = Math.min(5.5, 3.6 + wave * 0.05);
        eBullets.push({ x: sx - 2, y: sy, vx: dx / d * v, vy: dy / d * v, h: 12, c: PAL.R, laser: true });
        tone(1800, 0.1, 'sawtooth', 0.04, 600);
      }
    }

    if (e.type === 'diver' && e.mode === 'form' && form.y >= form.targetY) {
      if (--e.cd <= 0 && diving < maxDive) {
        e.mode = 'dive'; e.p = 0; e.sx = e.x; e.sy = e.y;
        e.tx = player.x + 22 - e.w / 2; e.side = Math.random() < 0.5 ? -1 : 1;
        e.dur = Math.max(100, 170 - wave * 3); e.shot = false;
        tone(600, 0.4, 'square', 0.04, 150);
      } else if (e.cd <= 0) e.cd = 30;
    } else if (e.mode === 'dive') {
      e.p += 1 / e.dur;
      const p = e.p;
      e.x = e.sx + (e.tx - e.sx) * p + Math.sin(p * Math.PI * 2) * 60 * e.side;
      e.y = e.sy + p * (H + 40 - e.sy);
      if (!e.shot && p > 0.3) {
        e.shot = true;
        eBullets.push({ x: e.x + e.w / 2, y: e.y + e.h, vx: 0, vy: bspeed + 1, h: 9, c: PAL.O });
      }
      if (e.y > H + 20) { e.mode = 'return'; e.y = -40; e.x = slotPos(e).x; }
    } else if (e.mode === 'return') {
      const s = slotPos(e);
      e.x += (s.x - e.x) * 0.1;
      e.y += 3;
      if (e.y >= s.y) { e.mode = 'form'; e.cd = 200 + Math.random() * 300 - wave * 5; }
    } else if (e.mode === 'free') {
      e.x += e.vx; e.y += e.vy;
      if (e.x < 4 || e.x + e.w > W - 4) e.vx *= -1;
      if (e.y > H + 20) { enemies.splice(j, 1); continue; }
    }

    // Kontakt mit Spieler
    if ((e.mode === 'dive' || e.mode === 'free' || e.mode === 'form') &&
        rectHit(e.x + 2, e.y + 2, e.w - 4, e.h - 4, player.x + 4, player.y + 4, player.w - 8, player.h - 6)) {
      if (player.inv <= 0) { hurtPlayer(); killEnemy(j); continue; }
    }
    // durch Barrikaden fressen
    if (e.y + e.h > barY) eraseRect(e.x, e.y, e.w, e.h);
  }

  // Invasion: Formation erreicht das Schiff
  for (const e of enemies) if (e.mode === 'form' && e.y + e.h >= playerY - 4) {
    lives = 0; player.dead = true; deathT = 90; sfx.playerHit(); shake = 20;
    explode(player.x + 22, player.y + 16, 40, [PAL.C, PAL.O, PAL.Y], 4, 5);
    banner = { text: 'INVASION', sub: 'DIE ALIENS SIND GELANDET', t: 90, color: PAL.R };
    break;
  }
}

/* ---------- Bosse ---------- */
function updateBoss() {
  const b = boss;
  b.t++; if (b.flash) b.flash--;
  if (b.y < b.ty) { b.y += 1.2; return; }
  const L = b.lvl, half = b.hp < b.max / 2;
  const bv = Math.min(5.5, 3 + 0.3 * L);

  if (b.k === 0) { // Mutterschiff: pendelt, Faecher, holt Begleiter
    b.x = W / 2 - b.w / 2 + Math.sin(b.t * 0.012 * (1 + 0.2 * L)) * (W / 2 - b.w / 2 - 8);
    const every = Math.max(50, (half ? 70 : 95) - 10 * L);
    if (b.t % every === 0) {
      const n = 5 + 2 * L;
      for (let i = 0; i < n; i++) {
        const a = Math.PI / 2 + (i - (n - 1) / 2) * 0.22;
        eBullets.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: Math.cos(a) * bv, vy: Math.sin(a) * bv, h: 9, c: PAL.O });
      }
      tone(220, 0.2, 'square', 0.08, 110);
    }
    if (half && b.t % 260 === 0) spawnMinis(2);
  }

  if (b.k === 1) { // Laserkrake: folgt dir, laedt den Laser
    const tx = player.x + 22 - b.w / 2;
    if (!b.laser) b.x += Math.max(-1.2, Math.min(1.2, (tx - b.x) * 0.02)) * (1 + 0.3 * L);
    b.x = Math.max(4, Math.min(W - b.w - 4, b.x));
    if (!b.laser && b.t % Math.max(150, 260 - 30 * L) === 0) {
      b.laser = { x: b.x + b.w / 2, t: 0, warn: Math.max(55, 85 - 10 * L), fire: 60 };
      sfx.laserCharge();
    }
    if (b.laser) {
      const l = b.laser; l.t++;
      if (l.t === l.warn) { sfx.laserFire(); shake = 8; }
      if (l.t > l.warn) {
        const lw = 22;
        for (let y = b.y + b.h; y < H; y += 6) hitBarricade(l.x + (Math.random() - 0.5) * lw, y, 1.2);
        if (rectHit(l.x - lw / 2, b.y + b.h, lw, H, player.x + 6, player.y, player.w - 12, player.h)) hurtPlayer();
      }
      if (l.t > l.warn + l.fire) b.laser = null;
    } else if (b.t % Math.max(30, (half ? 40 : 55) - 5 * L) === 0) {
      const sx = b.x + b.w / 2, sy = b.y + b.h;
      const dx = player.x + 22 - sx, dy = player.y - sy, d = Math.hypot(dx, dy);
      eBullets.push({ x: sx, y: sy, vx: dx / d * bv, vy: dy / d * bv, h: 12, c: PAL.R, laser: true });
    }
  }

  if (b.k === 2) { // Schwarmkoenigin: Acht-Schleife, Spirale, Brut
    const s = b.t * 0.01 * (1 + 0.15 * L);
    b.x = W / 2 - b.w / 2 + Math.sin(s) * (W / 2 - b.w / 2 - 8);
    b.y = b.ty + Math.sin(s * 2) * 40;
    if (b.t % Math.max(5, 9 - L) === 0) {
      b.ang += 0.38;
      const arms = half ? 2 : 1;
      for (let a = 0; a < arms; a++) {
        const ang = b.ang + a * Math.PI;
        const vy = Math.sin(ang) * 2.4;
        if (vy > -0.5) eBullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(ang) * 2.4, vy: Math.abs(vy) + 0.8, h: 6, c: PAL.M });
      }
    }
    if (b.t % Math.max(180, 320 - 40 * L) === 0) spawnMinis(3 + L);
  }
}
function spawnMinis(n) {
  for (let i = 0; i < n; i++) {
    const m = makeEnemy('mini', 0, 0);
    m.mode = 'free';
    m.x = boss.x + boss.w / 2 - m.w / 2 + (i - (n - 1) / 2) * 24; m.y = boss.y + boss.h;
    m.vx = (i - (n - 1) / 2) * 0.8 + (Math.random() - 0.5); m.vy = 0.9 + boss.lvl * 0.2;
    enemies.push(m);
  }
  waveTotal = Math.max(waveTotal, enemies.length);
}
function killBoss() {
  const b = boss;
  boss = null;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  for (let i = 0; i < 5; i++) explode(cx + (Math.random() - 0.5) * b.w, cy + (Math.random() - 0.5) * b.h, 30, [PAL.O, PAL.Y, PAL.R, '#fff', PAL.P], 5, 6);
  sfx.bigBoom(); shake = 30;
  addScore(pts(1000) * (b.lvl + 1), cx, cy);
  eBullets = [];
  // Brut verschwindet mit der Koenigin
  for (const e of enemies) explode(e.x + e.w / 2, e.y + e.h / 2, 10, [PAL.M, PAL.O], 2, 3);
  enemies = [];
  dropCapsule(cx, cy);
}

/* ---------- Spielende und Bestenliste ---------- */
let entry = null;
function endGame() {
  sfx.gameOver();
  releaseWake();
  const rank = top10.filter(r => r.s >= score).length;
  if (score > 0 && rank < 10) {
    entry = { rank, letters: (lastInitials + 'AAA').slice(0, 3).split(''), pos: 0 };
    setState('entername');
  } else {
    entry = null;
    setState('gameover');
  }
}
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function cycleLetter(i, d) {
  const cur = ABC.indexOf(entry.letters[i]);
  entry.letters[i] = ABC[(cur + d + ABC.length) % ABC.length];
  entry.pos = i;
  sfx.click();
}
function saveEntry() {
  const n = entry.letters.join('');
  lastInitials = n; store.set('aada-initials', n);
  top10.push({ n, s: score, w: wave, d: Date.now() });
  top10.sort((a, b) => b.s - a.s || a.d - b.d);
  top10 = top10.slice(0, 10);
  store.set('aada-top10', top10);
  const justSaved = top10.find(r => r.n === n && r.s === score);
  highlight = justSaved ? justSaved.d : null;
  entry = null;
  sfx.power();
  setState('title');
}
let highlight = null;
function hiScore() { return Math.max(score, top10.length ? top10[0].s : 0); }

/* ---------- Zeichnen ---------- */
function txt(s, x, y, size, color, align = 'left') {
  ctx.font = size + 'px ' + FONT;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function pad(n, l = 6) { return String(n).padStart(l, '0'); }

// Knoepfe (logische Koordinaten), werden beim Zeichnen gesetzt
let btns = [];
function button(id, x, y, w, h) { btns.push({ id, x, y, w, h }); }

function draw() {
  btns = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (offX + sx) * dpr, (offY + sy) * dpr);
  ctx.imageSmoothingEnabled = false;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  // Sterne
  ctx.fillStyle = '#fff';
  for (const s of stars) { ctx.globalAlpha = s.a; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  if (state === 'title') drawTitle();
  else {
    drawGame();
    if (state === 'paused') drawPause();
    if (state === 'gameover') drawGameOver();
    if (state === 'entername') drawEntry();
  }
  ctx.restore();

  // Rand, wenn das Spielfeld schmaler als das Fenster ist (Mac, iPad)
  if (offX > 2) {
    ctx.strokeStyle = '#123a20'; ctx.lineWidth = 2 / scale;
    ctx.strokeRect(-1, -1, W + 2, H + 2);
  }
}

function drawWatermark() {
  ctx.globalAlpha = 0.06;
  txt('TOTTI', W / 2, H * 0.42, 54, '#fff', 'center');
  txt('GAMES', W / 2, H * 0.42 + 62, 54, '#fff', 'center');
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const y0 = safeTop + 10;
  // Ton
  ctx.strokeStyle = '#1f8f3d'; ctx.lineWidth = 2;
  ctx.strokeRect(12, y0, 32, 32);
  drawSpeaker(18, y0 + 8, soundOn);
  button('sound', 4, y0 - 8, 48, 48);
  // Pause
  ctx.strokeRect(W - 44, y0, 32, 32);
  ctx.fillStyle = GREEN;
  ctx.fillRect(W - 35, y0 + 9, 5, 14); ctx.fillRect(W - 26, y0 + 9, 5, 14);
  button('pause', W - 52, y0 - 8, 48, 48);

  txt('SCORE', 56, y0 + 11, 8, MUTED);
  txt(pad(score), 56, y0 + 30, 12, GREEN);
  txt('HI', W - 56, y0 + 11, 8, MUTED, 'right');
  txt(pad(hiScore()), W - 56, y0 + 30, 12, score >= hiScore() && score > 0 ? PAL.Y : GREEN, 'right');

  txt('WELLE ' + wave, 14, y0 + 58, 10, GREEN);
  for (let i = 0; i < lives; i++) drawSprite(SPR.ship, W - 14 - 22 - i * 26, y0 + 46, 2);

  // aktive Power-ups als Balken
  const act = ['triple', 'rapid', 'shield'].filter(k => power[k] > 0);
  if (act.length) {
    const gap = 6, bw = (W - 28 - gap * (act.length - 1)) / act.length;
    act.forEach((k, i) => {
      const x = 14 + i * (bw + gap), y = y0 + 68;
      ctx.fillStyle = '#0b1a10'; ctx.fillRect(x, y, bw, 16);
      ctx.globalAlpha = power[k] < 120 && Math.floor(power[k] / 8) % 2 ? 0.25 : 0.45;
      ctx.fillStyle = CAPS[k].c; ctx.fillRect(x, y, bw * power[k] / POWER_TIME, 16);
      ctx.globalAlpha = 1;
      const label = act.length > 1 ? CAPS[k].l + ' ' + Math.ceil(power[k] / 60) + 'S' : CAPS[k].name;
      txt(label, x + 6, y + 12, 8, '#e8fbff');
      if (act.length === 1) txt(Math.ceil(power[k] / 60) + ' S', x + bw - 6, y + 12, 8, '#e8fbff', 'right');
    });
  }
}
function drawSpeaker(x, y, on) {
  ctx.fillStyle = on ? GREEN : MUTED;
  ctx.fillRect(x, y + 4, 5, 8); ctx.fillRect(x + 5, y + 1, 3, 14);
  if (on) { ctx.fillRect(x + 11, y + 2, 2, 2); ctx.fillRect(x + 13, y + 5, 2, 6); ctx.fillRect(x + 11, y + 12, 2, 2); }
  else { ctx.fillStyle = PAL.R; for (let i = 0; i < 8; i++) { ctx.fillRect(x + 11 + i, y + 4 + i, 2, 2); ctx.fillRect(x + 18 - i, y + 4 + i, 2, 2); } }
}

function drawGame() {
  drawWatermark();

  // Barrikaden
  ctx.fillStyle = PAL.P;
  for (const bar of barricades) for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++)
    if (bar.m[y][x]) ctx.fillRect(bar.x + x * BC, bar.y + y * BC, BC, BC);

  // Gegner
  const anim = Math.floor(performance.now() / 400) % 2;
  for (const e of enemies) {
    const frames = sprFrames(e.type);
    drawSprite(frames[anim], e.x, e.y, TYPES[e.type].px, e.flash ? '#fff' : null);
    if (e.maxhp > 1 && e.hp < e.maxhp) {
      ctx.fillStyle = '#1c2a22'; ctx.fillRect(e.x, e.y - 6, e.w, 3);
      ctx.fillStyle = GREEN; ctx.fillRect(e.x, e.y - 6, e.w * e.hp / e.maxhp, 3);
    }
  }

  // Boss
  if (boss) {
    const b = boss;
    if (b.laser) {
      const l = b.laser;
      if (l.t <= l.warn) {
        if (Math.floor(l.t / 5) % 2) { ctx.fillStyle = 'rgba(255,51,68,.5)'; ctx.fillRect(l.x - 1, b.y + b.h, 2, H); }
      } else {
        const fl = 0.7 + Math.random() * 0.3;
        ctx.fillStyle = `rgba(255,51,68,${0.35 * fl})`; ctx.fillRect(l.x - 18, b.y + b.h, 36, H);
        ctx.fillStyle = `rgba(255,180,180,${fl})`; ctx.fillRect(l.x - 8, b.y + b.h, 16, H);
        ctx.fillStyle = '#fff'; ctx.fillRect(l.x - 3, b.y + b.h, 6, H);
      }
    }
    drawSprite(SPR.boss[b.k], b.x, b.y, b.px, b.flash ? '#fff' : null);
    // Lebensbalken
    const y = playTop - 12;
    ctx.fillStyle = '#2a0a10'; ctx.fillRect(14, y, W - 28, 6);
    ctx.fillStyle = PAL.R; ctx.fillRect(14, y, (W - 28) * b.hp / b.max, 6);
    txt(BOSS_NAMES[b.k], W / 2, y - 4, 8, PAL.R, 'center');
  }

  if (ufo) drawSprite(SPR.ufo, ufo.x, ufo.y, 3);

  // Kapseln
  for (const c of capsules) {
    const C = CAPS[c.k], pulse = 0.6 + 0.4 * Math.sin(c.t * 0.2);
    ctx.globalAlpha = pulse * 0.35; ctx.fillStyle = C.c; ctx.fillRect(c.x - 4, c.y - 4, 32, 30); ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(c.x, c.y, 24, 22);
    ctx.strokeStyle = C.c; ctx.lineWidth = 2; ctx.strokeRect(c.x, c.y, 24, 22);
    txt(C.l, c.x + 13, c.y + 17, 12, C.c, 'center');
  }

  // Schuesse
  ctx.fillStyle = GREEN;
  for (const b of bullets) ctx.fillRect(b.x, b.y, 3, 10);
  for (const b of eBullets) {
    ctx.fillStyle = b.c;
    if (b.laser) { ctx.save(); ctx.translate(b.x + 1.5, b.y + b.h / 2); ctx.rotate(Math.atan2(b.vy, b.vx) - Math.PI / 2); ctx.fillRect(-2, -b.h / 2, 4, b.h); ctx.restore(); }
    else ctx.fillRect(b.x, b.y, 3, b.h);
  }

  // Spieler
  if (!player.dead && !(player.inv > 0 && Math.floor(player.inv / 5) % 2)) {
    drawSprite(SPR.ship, player.x, player.y, 4);
    // Triebwerksflackern
    ctx.fillStyle = Math.random() < 0.5 ? PAL.O : PAL.Y;
    ctx.fillRect(player.x + 6, player.y + 32, 4, 2 + Math.random() * 5);
    ctx.fillRect(player.x + 34, player.y + 32, 4, 2 + Math.random() * 5);
    if (power.shield > 0) {
      ctx.strokeStyle = `rgba(57,255,106,${0.5 + 0.3 * Math.sin(performance.now() / 80)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(player.x + 22, player.y + 16, 32, 26, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Partikel und Punkte
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.t / 20);
    txt(p.text, p.x, p.y, 8, p.color || '#fff', 'center');
  }
  ctx.globalAlpha = 1;

  // Banner
  if (banner && state === 'play') {
    const a = Math.min(1, banner.t / 20);
    ctx.globalAlpha = a;
    const by = H * 0.45;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, by - 34, W, banner.sub ? 62 : 46);
    ctx.shadowColor = banner.color; ctx.shadowBlur = 12;
    txt(banner.text, W / 2, by, 16, banner.color, 'center');
    ctx.shadowBlur = 0;
    if (banner.sub) txt(banner.sub, W / 2, by + 20, 8, '#cfe9d6', 'center');
    ctx.globalAlpha = 1;
  }

  drawHUD();

  // Hinweis unten in den ersten Sekunden
  if (state === 'play' && wave === 1 && stateT < 400) {
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(stateT * 0.08);
    txt('ZIEHEN ZUM STEUERN', W / 2, H - safeBot - 22, 8, GREEN, 'center');
    ctx.globalAlpha = 1;
  }
}

function overlay(alpha = 0.75) { ctx.fillStyle = `rgba(0,0,0,${alpha})`; ctx.fillRect(0, 0, W, H); }
function bigButton(id, label, y, color = GREEN, w = W - 120) {
  const x = (W - w) / 2;
  ctx.fillStyle = '#0a2a14'; ctx.fillRect(x, y, w, 52);
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, 52);
  txt(label, W / 2, y + 32, 12, color, 'center');
  button(id, x, y, w, 52);
}

function drawPause() {
  overlay(0.7);
  txt('PAUSE', W / 2, H * 0.36, 24, GREEN, 'center');
  bigButton('resume', 'WEITER', H * 0.45);
  bigButton('quit', 'AUFGEBEN', H * 0.45 + 72, PAL.R);
  // Ton auch hier umschaltbar
  txt('TON: ' + (soundOn ? 'AN' : 'AUS'), W / 2, H * 0.45 + 170, 10, MUTED, 'center');
  button('sound', W / 2 - 80, H * 0.45 + 145, 160, 40);
}

function drawGameOver() {
  overlay(Math.min(0.8, stateT / 40));
  txt('GAME OVER', W / 2, H * 0.36, 24, PAL.R, 'center');
  txt('SCORE ' + pad(score), W / 2, H * 0.36 + 44, 12, GREEN, 'center');
  txt('WELLE ' + wave, W / 2, H * 0.36 + 68, 10, MUTED, 'center');
  if (stateT > 50) bigButton('menu', 'ZUM MENUE', H * 0.55);
}

function drawEntry() {
  overlay(Math.min(0.85, stateT / 30));
  ctx.shadowColor = PAL.Y; ctx.shadowBlur = 12;
  txt('NEUER REKORD', W / 2, H * 0.24, 18, PAL.Y, 'center');
  ctx.shadowBlur = 0;
  txt('PLATZ ' + (entry.rank + 1) + '  ·  ' + pad(score), W / 2, H * 0.24 + 32, 10, GREEN, 'center');
  txt('DEIN KUERZEL', W / 2, H * 0.24 + 66, 8, MUTED, 'center');
  const cy = H * 0.47;
  for (let i = 0; i < 3; i++) {
    const x = W / 2 + (i - 1) * 84;
    const sel = i === entry.pos;
    // hoch
    ctx.fillStyle = sel ? GREEN : '#2c6b3e';
    tri(x, cy - 66, -1);
    button('up' + i, x - 36, cy - 96, 72, 56);
    ctx.strokeStyle = sel ? GREEN : '#1f8f3d'; ctx.lineWidth = 3;
    ctx.strokeRect(x - 30, cy - 34, 60, 64);
    txt(entry.letters[i], x + 2, cy + 12, 28, sel ? '#fff' : GREEN, 'center');
    ctx.fillStyle = sel ? GREEN : '#2c6b3e';
    tri(x, cy + 62, 1);
    button('dn' + i, x - 36, cy + 34, 72, 56);
  }
  txt('PFEILE ANTIPPEN ZUM AENDERN', W / 2, H * 0.47 + 112, 8, MUTED, 'center');
  if (stateT > 30) bigButton('save', 'SPEICHERN', H * 0.47 + 140, PAL.Y);
}
function tri(x, y, dir) {
  ctx.beginPath();
  ctx.moveTo(x - 16, y - dir * 10); ctx.lineTo(x + 16, y - dir * 10); ctx.lineTo(x, y + dir * 12);
  ctx.closePath(); ctx.fill();
}

function drawTitle() {
  const t = stateT;
  const top = safeTop + 30;
  drawSprite(SPR.boss[Math.floor(t / 400) % 3], W / 2 - 69, top + 10 + Math.sin(t * 0.04) * 6, 6);
  ctx.shadowColor = GREEN; ctx.shadowBlur = 14;
  txt('ANGRIFF', W / 2, top + 126, 26, GREEN, 'center');
  txt('AUS DEM ALL', W / 2, top + 164, 22, GREEN, 'center');
  ctx.shadowBlur = 0;
  txt('TOTTI GAMES', W / 2, top + 190, 9, MUTED, 'center');

  // Bestenliste
  const ty = top + 236;
  txt('TOP 10', W / 2, ty, 12, PAL.C, 'center');
  ctx.fillStyle = '#123'; ctx.fillRect(40, ty + 10, W - 80, 2);
  txt('PL  NAME   PUNKTE   WELLE', 46, ty + 32, 8, MUTED);
  if (!top10.length) {
    txt('NOCH LEER', W / 2, ty + 80, 10, '#3d6b4a', 'center');
    txt('SPIEL UND TRAG DICH EIN', W / 2, ty + 104, 8, '#3d6b4a', 'center');
  }
  top10.forEach((r, i) => {
    const y = ty + 58 + i * 24;
    const hl = highlight && r.d === highlight && Math.floor(t / 20) % 2;
    const col = hl ? '#fff' : i === 0 ? PAL.Y : i < 3 ? GREEN : '#9fd8b0';
    txt(String(i + 1).padStart(2, ' '), 46, y, 10, col);
    txt(r.n, 92, y, 10, col);
    txt(pad(r.s), 164, y, 10, col);
    txt(String(r.w), W - 50, y, 10, col, 'right');
  });

  const by = Math.min(H - safeBot - 130, ty + 58 + 10 * 24 + 6);
  const blink = Math.floor(t / 35) % 2;
  bigButton('start', blink ? 'TIPPEN ZUM START' : 'TIPPEN ZUM START', by, blink ? GREEN : '#bfffd0', W - 100);
  txt('TON: ' + (soundOn ? 'AN' : 'AUS'), W / 2, by + 86, 9, soundOn ? GREEN : MUTED, 'center');
  button('sound', W / 2 - 80, by + 62, 160, 40);
  if (offX > 2) txt('PFEILE ODER MAUS · LEERTASTE', W / 2, by + 112, 7, '#3d6b4a', 'center');
}

/* ---------- Eingabe ---------- */
let drag = null;
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
function hitButton(p) {
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
  }
  return null;
}
function press(id) {
  switch (id) {
    case 'sound': setSound(!soundOn); sfx.click(); return true;
    case 'pause': pause(); return true;
    case 'resume': sfx.click(); setState('play'); requestWake(); return true;
    case 'quit': sfx.click(); player.dead = true; lives = 0; endGame(); return true;
    case 'menu': sfx.click(); setState('title'); return true;
    case 'start': newGame(); return true;
    case 'save': saveEntry(); return true;
  }
  if (id && id.startsWith('up')) { cycleLetter(+id[2], 1); return true; }
  if (id && id.startsWith('dn')) { cycleLetter(+id[2], -1); return true; }
  return false;
}
function pause() {
  if (state !== 'play' || player.dead) return;
  setState('paused'); drag = null; sfx.click(); releaseWake();
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = toLogical(e);
  const id = hitButton(p);
  if (state === 'play') {
    if (id === 'sound' || id === 'pause') { press(id); return; }
    drag = { id: e.pointerId, x: p.x };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  if (state === 'title') { if (!press(id) && stateT > 20) newGame(); return; }
  if (state === 'paused') { if (!press(id)) { /* Tippen daneben: nichts */ } return; }
  if (state === 'gameover') { if (stateT > 50) { sfx.click(); setState('title'); } return; }
  if (state === 'entername') { if (stateT > 30) press(id); return; }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play' || !player || player.dead) return;
  const p = toLogical(e);
  player.x += (p.x - drag.x) * 1.25;
  player.x = Math.max(4, Math.min(W - player.w - 4, player.x));
  drag.x = p.x;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  initAudio();
  keys[e.key] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  if (e.key === 'm' || e.key === 'M') { if (state !== 'entername') setSound(!soundOn); }
  if (state === 'title' && (e.key === ' ' || e.key === 'Enter')) newGame();
  else if (state === 'play' && (e.key === 'p' || e.key === 'P' || e.key === 'Escape')) pause();
  else if (state === 'paused' && (e.key === ' ' || e.key === 'p' || e.key === 'P' || e.key === 'Escape' || e.key === 'Enter')) press('resume');
  else if (state === 'gameover' && stateT > 50 && (e.key === ' ' || e.key === 'Enter')) setState('title');
  else if (state === 'entername' && stateT > 30) {
    const k = e.key.toUpperCase();
    if (k.length === 1 && ABC.includes(k)) { entry.letters[entry.pos] = k; entry.pos = Math.min(2, entry.pos + 1); sfx.click(); }
    else if (e.key === 'ArrowUp') cycleLetter(entry.pos, 1);
    else if (e.key === 'ArrowDown') cycleLetter(entry.pos, -1);
    else if (e.key === 'ArrowLeft') entry.pos = Math.max(0, entry.pos - 1);
    else if (e.key === 'ArrowRight') entry.pos = Math.min(2, entry.pos + 1);
    else if (e.key === 'Backspace') entry.pos = Math.max(0, entry.pos - 1);
    else if (e.key === 'Enter') saveEntry();
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (ac) ac.suspend(); }
  else if (ac && soundOn) ac.resume();
});
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

/* ---------- Bildschirm wach halten ---------- */
let wakeLock = null;
async function requestWake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; }
}
function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }

/* ---------- Hauptschleife mit festem Takt ---------- */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  updateMusic();
  draw();
  requestAnimationFrame(loop);
}

layout();
player = { x: W / 2 - 22, y: playerY, w: 44, h: 32, inv: 0, dead: false };
bullets = []; eBullets = []; enemies = []; particles = []; capsules = []; popups = []; barricades = [];
const start = () => requestAnimationFrame(t => { last = t; loop(t); });
if (document.fonts && document.fonts.load) {
  Promise.race([document.fonts.load('12px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]).then(start, start);
} else start();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
